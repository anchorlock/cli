# AnchorLock 静态站（产品介绍 + 文档）
# 挂在 139.199.172.184 的三合一 Nginx（sites-available/rule-engine）里。
#
# 访问：
#   http://139.199.172.184/anchorlock/
#   http://139.199.172.184/anchorlock/docs/

location ^~ /anchorlock/ {
    alias /var/www/anchorlock/;
    index index.html;
    add_header Cache-Control "no-cache, must-revalidate" always;
}

location = /anchorlock {
    return 301 /anchorlock/;
}
